# GitLab CE 本機開發部署用 docker compose 設定。
#
# 對外 port：
#   - 8080 -> 80（HTTP）
#   - 2222 -> 22（SSH，避免與 macOS 本機 sshd 衝突）
#
# 資料持久化：使用 bind mount 至 ./data/{config,data,logs}，
# 由 ../run.sh 啟動前確保目錄已建立。
#
# name 必須明確指定：不指定時 Compose 會以所在目錄名（docker）作為專案名，
# 而其他專案的 compose 檔同樣放在各自的 docker/ 目錄，會被判定為同一專案，
# 導致 orphan 警告與跨專案誤刪的風險。
name: gitlab

services:
  gitlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: macdev/gitlab:latest
    container_name: gitlab
    hostname: gitlab.local
    restart: always
    shm_size: '256m'
    # 容器記憶體上限 4G（搭配上方 GITLAB_OMNIBUS_CONFIG 瘦身，常駐約 2.5-3G）。
    # 非 swarm 的 docker compose up 下，deploy.resources.limits.memory 有效（套為 cgroup limit）；
    # reservations.memory 在非 swarm 會被忽略，故不設。不限 CPU：首次 reconfigure 吃 CPU，不限可加速初始化。
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "8080:80"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        # 讓容器內 nginx 聽 80，對齊 ports「8080:80」與 healthcheck 的 :80；
        # 否則 nginx 會依 external_url 預設聽 8080，導致對外映射與 healthcheck 打不到而卡在 starting。
        nginx['listen_port'] = 80
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        # 關閉 Let's Encrypt（本機 HTTP 環境用不到）
        letsencrypt['enable'] = false
        # 關閉 Prometheus 監控以節省資源（如需可移除此行）
        prometheus_monitoring['enable'] = false
        # --- 資源瘦身（開發/備份取向，非生產規格）---
        puma['worker_processes'] = 0          # 單進程模式，記憶體最低
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        sidekiq['max_concurrency'] = 5        # 降低背景任務並發
        postgresql['shared_buffers'] = "128MB"
        # macOS 的 virtiofs bind mount 不支援對 unix socket 檔案 chmod（回 EINVAL），
        # PostgreSQL 建立 socket 後設定權限會失敗而無法啟動；
        # 故將 socket 目錄移出掛載區（容器內本地路徑），DB 資料仍留在 ./data/data。
        postgresql['unix_socket_directory'] = '/run/postgresql'
        gitlab_rails['db_host'] = '/run/postgresql'
        postgresql['max_connections'] = 100
        # Redis 的 socket 同樣移出掛載區。daemon 重啟時容器是被直接 start、不會走
        # ../run.sh，殘留在 virtiofs 上的 redis.socket 不會被清掉，redis 會以
        # 「Failed opening Unix socket: bind: Operation not supported」啟動失敗，
        # 連帶讓 puma 與 sidekiq 反覆崩潰、對外只表現為 502。
        # 放到 tmpfs 後每次啟動都是乾淨的，restart: always 才對 GitLab 真正成立。
        # RDB 檔仍留在 ./data/data 的 redis/ 目錄，不受影響。
        redis['unixsocket'] = '/run/gitlab-redis/redis.socket'
        gitlab_rails['redis_socket'] = '/run/gitlab-redis/redis.socket'
        # Puma 對 Rails 的 unix socket 直接停用，改讓 Workhorse 走既有的 TCP 埠。
        # 原因同上：daemon 重啟後殘留在 virtiofs 上的 gitlab.socket 無法被重新
        # bind，Workhorse 連過去會得到「connect: operation not supported」，
        # 對外一樣是 502。Puma 本來就同時 bind tcp://127.0.0.1:8080（見 puma.rb），
        # 停掉 unix bind 不減少任何能力，且完全不依賴掛載區的檔案狀態。
        # puma['socket'] 給空字串即可：範本以 `!listen_socket.empty?` 決定是否 bind。
        # auth_backend 必須「明確指定」，omnibus 才會把 workhorse 的 auth_socket
        # 設為 nil（見 libraries/puma.rb:42 與 libraries/gitlab_workhorse.rb:24）；
        # 值與內建預設相同，僅指定行為本身有意義。
        puma['socket'] = ''
        gitlab_workhorse['auth_backend'] = 'http://localhost:8080'
        # Workhorse 自己對外 listen 的 socket 同樣搬進 tmpfs。2026-08-22 起連續 6.5 天
        # 全站 502 就源於此：daemon 直接 start 容器（不走 ../run.sh）時，上一輪殘留在
        # virtiofs 上的 socket 無法 unlink，workhorse 以「shutting down: remove ...:
        # operation not supported」每秒崩潰一次，nginx 沒有 upstream。容器主行程
        # runsvdir 從頭到尾都活著，restart: always 完全不介入——這正是「容器 Up、
        # 對外卻 502」的成因。
        # 只需 sockets_directory 這一個開關：listen_addr 未指定時，omnibus 會以
        # File.join(sockets_directory, 'socket') 自動補上（libraries/gitlab_workhorse.rb
        # :27,35），nginx upstream、gitlab-shell 與 gitaly 的 gitlab.url 都由同一組值
        # 衍生，reconfigure 時全數自動跟上。反之若只改 listen_addr，sockets_directory
        # 會維持 nil，Chef 就不會去建那個目錄。
        gitlab_workhorse['sockets_directory'] = '/run/gitlab-workhorse'
        # Gitaly 同理，症狀是「unable to start the bootstrap: unlinkat ...:
        # operation not supported」。它靠 runit 每秒重試偶爾能撞過去（單一輪替日誌
        # 最高 45288 次失敗），先前因此被誤記為「實測可自行重建」——那是運氣不是設計。
        # gitaly['configuration'] 是 hash，這裡只給部分 key 不會蓋掉套件預設值：
        # 設定經 node.consume_attributes 寫進 normal 層（package/recipes/config.rb:39），
        # 與 attributes/default.rb 的 default 層由 Chef 的 hash_only_merge 遞迴合併，
        # 未指定的 prometheus_listen_addr、logging、storage、gitlab.secret_file 一律
        # 保留；auth.token 由 libraries/gitaly.rb:38-40 以 ||= 補上。Rails 端的
        # gitaly_address 也由 socket_path 推導後寫進 gitlab.yml 的 storages:。
        gitaly['configuration'] = {
          socket_path: '/run/gitaly/gitaly.socket',
          runtime_dir: '/run/gitaly-runtime',
        }
        registry['enable'] = false            # 已有獨立 Harbor，關閉內建 registry
        gitlab_kas['enable'] = false          # 關閉 K8s Agent Server
    # GitLab 元件互連用的 unix socket 一律不落在 bind mount：macOS 的 virtiofs 不支援
    # 對 socket 檔 unlink／chmod，只要上一輪留下殘留檔，元件就永遠起不來。tmpfs 每次
    # 容器 start 都是全新的，連 daemon 繞過 ../run.sh 直接 start 也保證乾淨，
    # restart: always 對 GitLab 才真正成立。
    # uid/gid 皆為 image 內建帳號：gitlab-psql 996、gitlab-redis 997、git 998、
    # gitlab-www 999。mode 一律對齊 omnibus 自己建立該目錄時的權限，reconfigure 才會
    # 判定為已就緒而不去動它（也就不會多送一次 notifies :restart）。
    tmpfs:
      # PostgreSQL／Redis：socket 由 omnibus 以 unixsocketperm 777 建立，目錄給 0755
      # 讓以 git 執行的 Rails、Sidekiq、Workhorse 得以進入目錄連線。
      - /run/postgresql:uid=996,gid=996,mode=0755
      - /run/gitlab-redis:uid=997,gid=997,mode=0755
      # Workhorse：連線方是以 gitlab-www 執行的 nginx，故 group 給 gitlab-www、
      # mode 0750，與 recipes/gitlab-workhorse.rb:35-43 建立此目錄時完全一致。
      - /run/gitlab-workhorse:uid=998,gid=999,mode=0750
      # Gitaly socket：連線方只有以 git 執行的 Rails／Sidekiq／gitlab-shell，0700 即可。
      # 這個目錄沒有對應的 Chef directory 資源，權限完全由這一行決定。
      - /run/gitaly:uid=998,gid=998,mode=0700
      # Gitaly runtime_dir：與上面的 socket 目錄分開掛，因為兩者需求相反。
      # 1. 必須加 exec。gitaly 每次啟動會把約 129 MB 的輔助執行檔（gitaly-hooks、
      #    gitaly-ssh、gitaly-git-* 等，mode 0500）解壓到這裡，之後每個 git 操作都要
      #    從這裡 exec（GIT_EXEC_PATH 與 core.hooksPath 都指向它）。docker 的 tmpfs
      #    預設帶 noexec，不明確加 exec 會讓所有 git 操作直接掛掉。
      # 2. 必須給 size。tmpfs 不指定時上限是主機記憶體的一半，而其佔用計入本容器的
      #    4G cgroup。單一世代 129 MB、優雅重啟期間新舊並存約 260 MB，取 512m 留餘裕；
      #    日後 gitaly 版本增加輔助執行檔時須同步調高。
      # 順帶解掉兩件事：內部 socket（sock.d/intern）是掛載區最後一個 socket；
      # 以及每次啟動不必再把 129 MB 寫穿 virtiofs。
      - /run/gitaly-runtime:exec,size=512m,uid=998,gid=998,mode=0700
    volumes:
      - ./data/config:/etc/gitlab
      - ./data/logs:/var/log/gitlab
      - ./data/data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
