# GitLab 對外存取 Service。
#
# 採 LoadBalancer 而非 NodePort：需求是 K8s 接手 Docker Compose 原本的
# 8080／2222 兩個 port，而 NodePort 的可用範圍是 30000-32767，涵蓋不到。
# Docker Desktop 會把 type: LoadBalancer 的 Service 直接綁到 localhost 的
# 指定 port（EXTERNAL-IP 會顯示為 localhost），這是唯一能用原 port 的做法。
#
# 因為綁的是同一組 port，啟動前 Docker Compose 版必須已經停止，否則 port
# 被佔用、LoadBalancer 會起不來。apply.sh 會先做這項檢查。
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: devops
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gitlab
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: ssh
      port: 2222
      targetPort: ssh
