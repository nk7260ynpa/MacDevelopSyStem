# GitLab Omnibus 單體 Deployment。
#
# 為什麼是 Deployment 而不是 StatefulSet：
#   本服務只有一個複本、也不需要穩定的網路識別或每複本獨立的儲存，
#   Deployment 已足夠，且 controller 會在 pod 掛掉時自動重建——這正是本次
#   從 Docker Compose 改用 K8s 的主要目的（restart: always 只看主行程存活，
#   GitLab 元件崩潰但 runsvdir 還活著時它完全不介入，見 README 的事故紀錄）。
#
#   replicas 固定為 1：GitLab Omnibus 是有狀態的單體服務，PVC 又是
#   ReadWriteOnce，多開一個只會卡在無法掛載。
#
#   strategy: Recreate —— 滾動更新會讓新舊 pod 同時存在，兩者搶同一個 RWO PVC
#   必定卡住；先關舊的再開新的才走得通。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: devops
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab
        app.kubernetes.io/part-of: macdevelopsystem
    spec:
      terminationGracePeriodSeconds: 60
      # 停用 K8s 自動注入的 Service 環境變數。
      # kubelet 預設會為同 namespace 內的每個 Service 注入一組變數，本 pod 因此
      # 被塞進 GITLAB_PORT=tcp://10.x.x.x:8080 這種值，同 namespace 的 Harbor
      # 也會貢獻 CORE_PORT、POSTGRESQL_PORT 等一大串。Docker Compose 版完全沒有
      # 這些變數，關掉才能讓兩套方案的環境一致。
      #
      # 這不只是潔癖：同一組注入已經實際咬過 Harbor 的 jobservice——它的 env 檔
      # 沒有 POSTGRESQL_PORT，注入值就沒有東西可以覆蓋，於是讀到
      # tcp://…:5432 而在 strconv.Atoi 失敗。凡是在 devops 底下新增的
      # Deployment，這個欄位都要帶上。
      enableServiceLinks: false
      # GitLab 的各元件互連 socket 一律不落在 hostPath（見下方 volumes 的說明），
      # 而 K8s 的 emptyDir 無法像 docker 的 tmpfs 那樣直接指定 uid/gid/mode，
      # 只能先以 root 身分把目錄權限調好，主容器才拿得到正確的擁有者與模式。
      #
      # uid/gid 皆為 GitLab image 內建帳號：gitlab-psql 996、gitlab-redis 997、
      # git 998、gitlab-www 999。權限值一律對齊 omnibus 自己建立這些目錄時的設定，
      # reconfigure 才會判定為已就緒而不再去動它（也就不會多送一次 notifies :restart）。
      initContainers:
        - name: init-runtime-dirs
          # 刻意與主容器用同一個 image：節點上本來就有，不必為了 chown 這幾行
          # 多拉一個外部 image，也就沒有額外的版本要跟進。
          image: gitlab/gitlab-ce:19.2.4-ce.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              # PostgreSQL／Redis：socket 由 omnibus 以 unixsocketperm 777 建立，
              # 目錄給 0755 讓以 git 執行的 Rails、Sidekiq、Workhorse 進得去。
              chown 996:996 /run/postgresql
              chmod 0755 /run/postgresql
              chown 997:997 /run/gitlab-redis
              chmod 0755 /run/gitlab-redis
              # Workhorse：連線方是以 gitlab-www 執行的 nginx，
              # 故 group 給 gitlab-www。
              chown 998:999 /run/gitlab-workhorse
              chmod 0750 /run/gitlab-workhorse
              # Gitaly socket：連線方只有以 git 執行的 Rails／Sidekiq／
              # gitlab-shell。這個目錄在 omnibus 裡沒有對應的 Chef directory
              # 資源，權限完全由這裡決定。
              chown 998:998 /run/gitaly
              chmod 0700 /run/gitaly
              chown 998:998 /run/gitaly-runtime
              chmod 0700 /run/gitaly-runtime
          volumeMounts:
            - name: run-postgresql
              mountPath: /run/postgresql
            - name: run-gitlab-redis
              mountPath: /run/gitlab-redis
            - name: run-gitlab-workhorse
              mountPath: /run/gitlab-workhorse
            - name: run-gitaly
              mountPath: /run/gitaly
            - name: run-gitaly-runtime
              mountPath: /run/gitaly-runtime
      containers:
        - name: gitlab
          # 版本釘選（勿改回 :latest），且必須與 ../docker/Dockerfile 的 FROM 同步——
          # 兩套部署方案要跑同一個版本，否則會重蹈本 repo 上一輪 K8s 方案「版本停止
          # 跟進、與 Compose 長期不同步」而被整套移除的覆轍。
          #
          # GitLab 有「必經升級停點」規則，跨越停點的升級會導致資料庫遷移失敗。
          # 停點清單以官方 repo 的 config/upgrade_path.yml 為準，19.x 為
          # 19.2、19.5、19.8、19.11。升級步驟見 README〈版本升級〉。
          image: gitlab/gitlab-ce:19.2.4-ce.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: ssh
              containerPort: 22
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              # 本段以 ../docker/docker-compose.yaml 的同名設定為基準逐項對齊，
              # 只有標示「K8s 專屬」的那一項是 Compose 沒有的。改動時請兩邊一起改。
              value: |
                external_url 'http://localhost:8080'
                # 讓容器內 nginx 聽 80，對齊 containerPort http=80 與 Service
                # 的 targetPort；否則 nginx 會依 external_url 預設聽 8080，
                # 導致對外流量與探針都打不到。
                nginx['listen_port'] = 80
                # K8s 專屬：/-/health|readiness|liveness 預設僅允許 127.0.0.0/8，
                # 而 kubelet 探針的來源是節點／Pod 網段（非 loopback），未放行會回 404
                # 而永遠不會就緒。本機開發叢集直接放行全部。
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
                gitlab_rails['gitlab_shell_ssh_port'] = 2222
                # 關閉 Let's Encrypt（本機 HTTP 環境用不到）
                letsencrypt['enable'] = false
                # 關閉 Prometheus 監控以節省資源（如需可移除此行）
                prometheus_monitoring['enable'] = false
                # --- 資源瘦身（開發/備份取向，非生產規格）---
                puma['worker_processes'] = 0          # 單進程模式，記憶體最低
                puma['min_threads'] = 1
                puma['max_threads'] = 4
                sidekiq['max_concurrency'] = 5        # 降低背景任務並發
                postgresql['shared_buffers'] = "128MB"
                # 以下六項是把所有 unix socket 移出掛載區的設定，與 Compose 完全相同。
                # 原因：hostPath 指向的是 macOS 的 virtiofs，不支援對 socket 檔
                # unlink／chmod，只要上一輪留下殘留檔，元件就永遠起不來——曾造成連續
                # 6.5 天全站 502（詳見 README〈事故紀錄〉）。改用 K8s 並不會讓這個
                # 限制消失，因為掛的是同一個 virtiofs，故整組原樣移植。
                postgresql['unix_socket_directory'] = '/run/postgresql'
                gitlab_rails['db_host'] = '/run/postgresql'
                postgresql['max_connections'] = 100
                redis['unixsocket'] = '/run/gitlab-redis/redis.socket'
                gitlab_rails['redis_socket'] = '/run/gitlab-redis/redis.socket'
                # Puma 對 Rails 的 unix socket 直接停用，改讓 Workhorse 走既有的 TCP 埠。
                # puma['socket'] 給空字串即可：範本以 `!listen_socket.empty?` 決定是否 bind。
                # auth_backend 必須「明確指定」，omnibus 才會把 workhorse 的 auth_socket
                # 設為 nil；值與內建預設相同，僅指定行為本身有意義。
                # 這裡的 8080 是容器內 Puma 的 TCP 埠，與對外的 8080 無關。
                puma['socket'] = ''
                gitlab_workhorse['auth_backend'] = 'http://localhost:8080'
                # 只需 sockets_directory 這一個開關：listen_addr 未指定時 omnibus 會以
                # File.join(sockets_directory, 'socket') 自動補上，nginx upstream、
                # gitlab-shell 與 gitaly 的 gitlab.url 都由同一組值衍生。
                gitlab_workhorse['sockets_directory'] = '/run/gitlab-workhorse'
                # gitaly['configuration'] 是 hash，這裡只給部分 key 不會蓋掉套件預設值：
                # 設定經 node.consume_attributes 寫進 normal 層，與
                # attributes/default.rb 的 default 層由 Chef 的
                # hash_only_merge 遞迴合併。
                gitaly['configuration'] = {
                  socket_path: '/run/gitaly/gitaly.socket',
                  runtime_dir: '/run/gitaly-runtime',
                }
                registry['enable'] = false      # 已有 Harbor，關閉內建 registry
                gitlab_kas['enable'] = false    # 關閉 K8s Agent Server
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: data
              mountPath: /var/opt/gitlab
            - name: run-postgresql
              mountPath: /run/postgresql
            - name: run-gitlab-redis
              mountPath: /run/gitlab-redis
            - name: run-gitlab-workhorse
              mountPath: /run/gitlab-workhorse
            - name: run-gitaly
              mountPath: /run/gitaly
            - name: run-gitaly-runtime
              mountPath: /run/gitaly-runtime
            - name: dev-shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "250m"
              memory: "1536Mi"   # 1.5Gi
            # 不設 CPU limit：首次 reconfigure 很吃 CPU，不限可明顯加速初始化。
            # memory limit 4Gi 與 Compose 的 deploy.resources.limits.memory 一致。
            # 注意 emptyDir{medium: Memory} 的用量會計入這個上限，五個 runtime 目錄
            # 加 /dev/shm 最多約 800Mi，調整 sizeLimit 時要一併考慮。
            limits:
              memory: "4Gi"
          # startupProbe 負責涵蓋整個初始化期間，通過之前 readiness 與 liveness
          # 都不會執行。這是必要的：首次啟動需 3-5 分鐘自我初始化，而以遷移過來的
          # 資料冷啟動、走 virtiofs 且快取全冷時可能更久。少了它就只能把 liveness
          # 的 initialDelaySeconds 開得很大來遷就，一旦估得不夠就會在 reconfigure
          # 中途把 pod 砍掉重來，症狀看起來會很像 virtiofs 事故、極難定位。
          # 30s x 60 = 最多容忍 30 分鐘。
          startupProbe:
            httpGet:
              path: /-/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          # 有了 startupProbe 之後 liveness 不必再遷就初始化時間，可以收緊到
          # 「連續 5 分鐘無回應才重建」——這正是 restart: always 救不了、
          # 而改用 K8s 要解決的那種「行程活著但服務死了」的狀態。
          livenessProbe:
            httpGet:
              path: /-/health
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        # 持久化資料：綁到 macOS 的 gitlab/k8s/data，可直接備份與遷移。
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: logs
          persistentVolumeClaim:
            claimName: gitlab-logs
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        # 以下五個對應 Compose 的 tmpfs：GitLab 元件互連用的 unix socket 一律不落在
        # hostPath。emptyDir{medium: Memory} 就是節點上的 tmpfs，每次 pod 啟動都是
        # 全新的，不會有上一輪的殘留檔——這正是 restart/重建對 GitLab 真正成立的前提。
        # 權限由 initContainer 調整（emptyDir 本身無法指定 uid/gid/mode）。
        - name: run-postgresql
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run-gitlab-redis
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run-gitlab-workhorse
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run-gitaly
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # Gitaly runtime_dir 需求與上面的 socket 目錄相反，故分開掛：
        # gitaly 每次啟動會把約 129 MB 的輔助執行檔（gitaly-hooks、gitaly-ssh、
        # gitaly-git-* 等）解壓到這裡，之後每個 git 操作都要從這裡 exec
        # （GIT_EXEC_PATH 與 core.hooksPath 都指向它）。kubelet 掛 tmpfs 不帶
        # noexec，故可執行；但容量必須給足——單一世代 129 MB，優雅重啟期間新舊
        # 並存約 260 MB，取 512Mi 留餘裕。日後 gitaly 版本增加輔助執行檔時須調高。
        - name: run-gitaly-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # 對應 Compose 的 shm_size: '256m'。K8s 的 /dev/shm 預設只有 64Mi，
        # PostgreSQL 的平行查詢與 reconfigure 期間可能不夠用。
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
