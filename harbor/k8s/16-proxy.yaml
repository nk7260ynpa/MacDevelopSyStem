# Proxy（nginx，Harbor 唯一的對外入口）。
#
# 採 LoadBalancer 而非 NodePort：需求是 K8s 接手 Docker Compose 原本的 8081，
# 而 NodePort 的可用範圍是 30000-32767，涵蓋不到。Docker Desktop 會把
# type: LoadBalancer 的 Service 直接綁到 localhost 的指定 port。
#
# 對外 8081 → 容器內 nginx 的 8080，與 Compose 的「8081:8080」完全一致；
# harbor.yml 的 external_url 因此不需要更動（仍是 http://localhost:8081）。
#
# 對外入口有兩條路徑，兩者各綁一個網路命名空間，缺一不可：
#   - Service（LoadBalancer）：macOS 主機 → Harbor。瀏覽器 UI、主機上的 curl。
#   - 容器的 hostPort：Docker Desktop VM → Harbor。docker daemon 拉映像、
#     以及所有 --network host 的容器。
# Docker Desktop 對 LoadBalancer 的實作是在 macOS 主機開 listener，那個
# listener 不在 VM 內，而 daemon 解析映像來源是在 VM 那一側，所以只有
# LoadBalancer 時 daemon 會拿到 connection refused。詳見下方 ports 的註解。
#
# Service 名取 harbor（不是 proxy）：這是給人用的對外入口，內部沒有任何設定
# 檔以 proxy 為名互連，取一個一眼看得懂的名字比較好。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: proxy
        app.kubernetes.io/part-of: macdevelopsystem
    spec:
      # 停用 K8s 自動注入的 Service 環境變數。
      # kubelet 預設會為同 namespace 內的每個 Service 注入一組變數，例如
      # POSTGRESQL_PORT=tcp://10.x.x.x:5432、CORE_PORT=…、GITLAB_PORT=…。
      # 這些名稱與 Harbor 自己設定檔用的鍵直接撞名：實測 jobservice 因此讀到
      # POSTGRESQL_PORT=tcp://…:5432 而在 strconv.Atoi 失敗
      # （env 檔沒有這個鍵時就沒有東西可以覆蓋它）。Docker Compose 版沒有這種
      # 注入，關掉才能讓兩套方案的環境完全一致。
      enableServiceLinks: false
      containers:
        - name: proxy
          image: goharbor/nginx-photon:v2.15.2
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          ports:
            # hostPort 讓 kubelet（CNI portmap）在 node（即 Docker Desktop VM）
            # 綁 8081 轉進容器的 8080，VM 內的 127.0.0.1:8081 因此有監聽。
            #
            # 在「位址維持 127.0.0.1:8081 不變」的前提下，這是 docker daemon
            # 拉 Harbor 映像的唯一可行路徑：
            #   - LoadBalancer 綁在 macOS 主機端，VM 內連不到（connection refused）。
            #   - host.docker.internal:8081 在 VM 內連得通，但它不是 loopback、
            #     不在 daemon 的 insecure registry 清單（127.0.0.0/8）內，會被
            #     強制走 HTTPS 而失敗。
            # NodePort（127.0.0.1:31981）在 VM 內同樣可達且走 HTTP，但要改掉各
            # repo 寫死的位址、還得先固定住 NodePort，成本明顯較高。維持 8081
            # 則各 repo 的 Dockerfile FROM、CI 的 HARBOR_REGISTRY、runner 的
            # config.toml 一個字都不用改。
            #
            # Deployment 的 strategy 需維持 Recreate：hostPort 由單一 pod 獨佔，
            # 滾動更新時新舊 pod 並存會撞埠，新 pod 會卡在 Pending。
            # （RollingUpdate 搭 maxSurge: 0 也能避開，但既有設定本就是 Recreate，
            # 沒有理由改。）
            #
            # 未指定 hostIP，故綁 VM 內的 0.0.0.0——與 Compose 版的「8081:8080」
            # 行為一致，不是本次的退步。
            - name: http
              containerPort: 8080
              hostPort: 8081
          volumeMounts:
            - name: data
              mountPath: /etc/nginx
              subPath: config/nginx
            - name: data
              mountPath: /harbor_cust_cert
              subPath: config/shared/trust-certificates
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-data
---
apiVersion: v1
kind: Service
metadata:
  name: harbor
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: 8081
      targetPort: http
