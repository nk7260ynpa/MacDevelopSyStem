# JobService（背景任務執行器：垃圾回收、複寫、Webhook 等）。
#
# job_logs 落在 PVC 上是刻意的——harbor.yml 的 job_loggers 同時開了 STD_OUTPUT
# 與 FILE，FILE 那條會寫進 /var/log/jobs，UI 上「查看 job log」讀的就是它。
#
# Service 名必須是 jobservice：core 的 env 內是 JOBSERVICE_URL=http://jobservice:8080。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobservice
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: jobservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: jobservice
        app.kubernetes.io/part-of: macdevelopsystem
    spec:
      containers:
        - name: jobservice
          image: goharbor/harbor-jobservice:v2.15.2
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID"]
          envFrom:
            - secretRef:
                name: harbor-env-jobservice
          ports:
            - name: jobservice
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/log/jobs
              subPath: job_logs
            - name: data
              mountPath: /etc/jobservice/config.yml
              subPath: config/jobservice/config.yml
            - name: data
              mountPath: /harbor_cust_cert
              subPath: config/shared/trust-certificates
          readinessProbe:
            tcpSocket:
              port: jobservice
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: jobservice
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-data
---
apiVersion: v1
kind: Service
metadata:
  name: jobservice
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
  ports:
    - name: jobservice
      port: 8080
      targetPort: jobservice
