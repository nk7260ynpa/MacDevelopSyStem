# 內建 PostgreSQL。
#
# v2.15.2 映像的 entrypoint 為 ["/docker-entrypoint.sh", "15", "18"]，兩個參數即
# 舊／新的 PG 大版本；首次以本版啟動時若偵測到既有的 pg15 資料目錄，會自動跑
# pg_upgrade 升到 pg18。升級成功後 entrypoint 會「直接刪除」舊的 database/pg15，
# 容器內不留回退點，故升級前務必先備份整個 data 目錄。
# 另外 pg_upgrade 沿用舊叢集的索引檔，其排序來自升級前的 glibc collation，
# 升級後應重建索引：
#   kubectl -n devops exec deploy/postgresql -- \
#     reindexdb --all --username postgres
#
# Service 名必須是 postgresql：core 的 env 內是 POSTGRESQL_HOST=postgresql。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/part-of: macdevelopsystem
    spec:
      # 停用 K8s 自動注入的 Service 環境變數。
      # kubelet 預設會為同 namespace 內的每個 Service 注入一組變數，例如
      # POSTGRESQL_PORT=tcp://10.x.x.x:5432、CORE_PORT=…、GITLAB_PORT=…。
      # 這些名稱與 Harbor 自己設定檔用的鍵直接撞名：實測 jobservice 因此讀到
      # POSTGRESQL_PORT=tcp://…:5432 而在 strconv.Atoi 失敗
      # （env 檔沒有這個鍵時就沒有東西可以覆蓋它）。Docker Compose 版沒有這種
      # 注入，關掉才能讓兩套方案的環境完全一致。
      enableServiceLinks: false
      containers:
        - name: postgresql
          image: goharbor/harbor-db:v2.15.2
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          # 對應 Compose 的 env_file: data/config/db/env，
          # 由 apply.sh 以 --from-env-file 轉成 Secret。
          envFrom:
            - secretRef:
                name: harbor-env-db
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: database
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: devops
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/part-of: macdevelopsystem
spec:
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
