# Harbor v2.15.2 本機開發部署。
#
# 服務組成：registry / registryctl / postgresql / redis / core /
#           portal / jobservice / proxy
#
# 對外 port：8081 -> proxy:8080（HTTP）
# 各 service 的設定檔由 ./build.sh 透過 goharbor/prepare image 從
# harbor.yml 產生至 ./data/config/<service>/，請務必先執行 ./build.sh
# 再以 ../run.sh 或 docker compose up -d 啟動。
#
# 重要設計：
#   - 以 name: harbor 固定 compose 專案名，避免與其他同樣放在 docker/ 目錄、
#     專案名同被推導為 "docker" 的專案互相視為 orphan 而誤刪。
#   - 各 service 一律以 Docker 內建的 json-file driver 寫 log（50m x 3 輪替），
#     不依賴任何收集用容器。此為刻意設計：主機重開機或 Docker daemon 單獨重啟時，
#     daemon 是逐容器依 restart policy 恢復，「完全不走 compose、不看 depends_on」，
#     故容器啟動時不得依賴其他容器就緒。早期版本改用 syslog driver 送往
#     harbor-log 的 1514 埠，正因此在 daemon 恢復時連不上而集體 exit 128，
#     必須另設守護巡檢才能補救；改為 json-file 後 restart: always 即可獨立自愈。
#     查看 log 改用 docker logs <容器> 或 ../run.sh logs。
name: harbor

services:
  registry:
    image: goharbor/registry-photon:v2.15.2
    container_name: registry
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/registry:/storage:z
      # root.crt 直接放在 registry 設定目錄內，靠此目錄掛載一併帶入
      # /etc/registry/root.crt；不另以單檔疊掛，以避開 Docker Desktop
      # （macOS virtiofs）「於目錄掛載上再疊單檔掛載」的 mountpoint 衝突。
      - ./data/config/registry/:/etc/registry/:z
      - type: bind
        source: ./data/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  registryctl:
    image: goharbor/harbor-registryctl:v2.15.2
    container_name: registryctl
    env_file:
      - ./data/config/registryctl/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/registry:/storage:z
      - ./data/config/registry/:/etc/registry/:z
      - type: bind
        source: ./data/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./data/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      registry:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 內建 PostgreSQL。v2.15.2 映像的 entrypoint 為
  # ["/docker-entrypoint.sh", "15", "18"]，兩個參數即舊／新的 PG 大版本；
  # 首次以本版啟動時若偵測到既有的 pg15 資料目錄，會自動跑 pg_upgrade 升到 pg18。
  # 注意：升級成功後 entrypoint 會「直接刪除」舊的 data/database/pg15，
  # 容器內不留回退點，故升級前務必先自行備份整個 ./data 目錄。
  # 另外 pg_upgrade 是沿用舊叢集的索引檔，其排序來自升級前的 glibc collation，
  # 可能造成列表載入不完、robot 帳號權限異常等症狀，升級後應重建索引：
  #   docker exec harbor-db reindexdb --all --username postgres
  postgresql:
    image: goharbor/harbor-db:v2.15.2
    container_name: harbor-db
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./data/database:/var/lib/postgresql/data:z
    networks:
      harbor:
    env_file:
      - ./data/config/db/env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # 快取與 jobservice 任務佇列。Harbor v2.15.2 起後端由 Redis 換成 Valkey，
  # 映像名亦隨之從 goharbor/redis-photon 改為 goharbor/valkey-photon
  # （v2.15.1 為最後一版 redis-photon）。官方 compose 樣板仍沿用 redis 作為
  # service 名、container_name 與資料路徑（/var/lib/redis），此處比照辦理，
  # 各 service 設定中的連線位址（redis:6379）因而不需更動。
  redis:
    image: goharbor/valkey-photon:v2.15.2
    container_name: redis
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/redis:/var/lib/redis
    networks:
      harbor:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  core:
    image: goharbor/harbor-core:v2.15.2
    container_name: harbor-core
    env_file:
      - ./data/config/core/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - ./data/ca_download/:/etc/core/ca/:z
      - ./data/:/data/:z
      - ./data/config/core/certificates/:/etc/core/certificates/:z
      - type: bind
        source: ./data/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./data/secret/core/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./data/secret/keys/secretkey
        target: /etc/core/key
      - type: bind
        source: ./data/psc/
        target: /etc/core/token/
      - type: bind
        source: ./data/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      harbor:
    depends_on:
      registry:
        condition: service_started
      redis:
        condition: service_started
      postgresql:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  portal:
    image: goharbor/harbor-portal:v2.15.2
    container_name: harbor-portal
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./data/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - harbor
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  jobservice:
    image: goharbor/harbor-jobservice:v2.15.2
    container_name: harbor-jobservice
    env_file:
      - ./data/config/jobservice/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/job_logs:/var/log/jobs:z
      - type: bind
        source: ./data/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./data/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      core:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  proxy:
    image: goharbor/nginx-photon:v2.15.2
    container_name: nginx
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./data/config/nginx:/etc/nginx:z
      - type: bind
        source: ./data/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    ports:
      - "8081:8080"
    depends_on:
      registry:
        condition: service_started
      core:
        condition: service_started
      portal:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  harbor:
    name: harbor
    external: false
